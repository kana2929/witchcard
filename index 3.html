<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ウィッチカード</title>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#1d6b57;--bg2:#165443;--card:#fffdf6;--back:#e8505b;--ink:#2a2a2a;--red:#d62839;--cor:#ec6a00;--cpu:#6a2ca8;--gold:#ffd23f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#134a3c;--bg2:#0e382d}}
:root[data-theme="dark"]{--bg:#134a3c;--bg2:#0e382d}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:#fff;font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 2vw 6px;overflow-x:hidden}

.score{display:flex;gap:6px;width:min(96vw,420px);align-items:center}
.pl{flex:1;display:flex;justify-content:space-between;align-items:center;padding:3px 12px;border-radius:12px;background:var(--bg2);border:2px solid transparent;font-weight:700;font-size:14px}
.pl b{font-family:"Fredoka","Zen Maru Gothic",sans-serif;font-size:22px}
.pl.on{border-color:var(--gold)}
#msg{flex:1;align-self:center;margin-right:0;padding:8px 12px;border-radius:14px;background:var(--bg2);font-size:14px;font-weight:700;color:var(--gold);line-height:1.4}
.stage{display:flex;align-items:flex-end;width:min(96vw,420px);min-height:40px;flex:none}
#board{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;width:min(96vw,420px);flex:0 1 auto;min-height:0}
.c{height:100%;min-height:0;perspective:400px;cursor:pointer;border:0;background:none;padding:0}
.in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.fast .in{transition-duration:.175s}
.c.f .in,.c.pk .in,.c.rv .in{transform:rotateY(180deg)}
.c.mp{outline:3px solid var(--gold);outline-offset:-3px;filter:brightness(1.2)}
.c.rv .fa{box-shadow:0 0 0 3px var(--gold),0 0 10px 2px rgba(255,210,63,.8)}
.c.pk .fa{box-shadow:0 0 0 3px var(--gold),0 0 10px 2px rgba(255,210,63,.8)}
.c.dkc{pointer-events:none}
.c.dkc .ba{background:radial-gradient(circle at 50% 40%,#3b1566,#07020f);border-color:#8a4bff;animation:dkp 1s ease-in-out infinite alternate}
.c.dkc .ba::after{content:'闇';color:#c9a8ff;font-size:clamp(16px,5vw,24px);font-weight:900}
.c.hid{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .5s,visibility 0s .5s}
.fa,.ba{position:absolute;inset:0;border-radius:8px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800}
.ba{background:url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20100%20100%27%3E%3Cpath%20d=%27M47%2034q0-12%2010-16l3%205q-7%203-7%2011z%27%20fill=%27%232a0f3d%27/%3E%3Cpath%20d=%27M57%2022q8-6%2014%200q-7-1-12%204z%27%20fill=%27%232a0f3d%27/%3E%3Cellipse%20cx=%2732%27%20cy=%2762%27%20rx=%2721%27%20ry=%2726%27%20fill=%27%232a0f3d%27/%3E%3Cellipse%20cx=%2768%27%20cy=%2762%27%20rx=%2721%27%20ry=%2726%27%20fill=%27%232a0f3d%27/%3E%3Cellipse%20cx=%2750%27%20cy=%2762%27%20rx=%2724%27%20ry=%2728%27%20fill=%27%232a0f3d%27/%3E%3Cpath%20d=%27M33%2056l7-11%207%2011zM53%2056l7-11%207%2011z%27%20fill=%27%23ff9a1f%27/%3E%3Cpath%20d=%27M46%2064l4-5%204%205z%27%20fill=%27%23ff9a1f%27/%3E%3Cpath%20d=%27M30%2070q20%2017%2040%200l-6%201-3%204-5-4-4%205-4-5-5%204-3-4z%27%20fill=%27%23ff9a1f%27/%3E%3C/svg%3E") 50% 54%/74% auto no-repeat,radial-gradient(circle at 50% 45%,rgba(255,236,170,.55),transparent 62%),repeating-linear-gradient(45deg,rgba(255,255,255,.1) 0 4px,transparent 4px 9px),linear-gradient(160deg,#ffb04a,#f26a00);border:3px solid #ffd23f}
.fa{font-family:"Fredoka","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;font-weight:700;background:var(--card);color:var(--cpu);transform:rotateY(180deg);font-size:clamp(16px,5vw,24px)}
.fa.w{justify-content:flex-start;padding:3px 2px 2px;gap:1px}
.cn{display:flex;align-items:center;gap:1px;font-size:clamp(12px,3.8vw,16px);line-height:1;white-space:nowrap}
.fa .cn small{font-size:.95em}
.ca{width:100%;flex:1;min-height:0;object-fit:cover;object-position:50% 25%;border-radius:5px;mix-blend-mode:multiply;pointer-events:none}
.fa small{font-size:clamp(14px,4.5vw,22px)}
.fa.r{color:var(--cor)}
.c.m{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .5s,visibility 0s .5s}
.c.m.pk .fa{box-shadow:none}
.c.burn{position:relative;pointer-events:none;animation:burn 1s ease-in forwards}
.c.burn::after{content:'🔥';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;animation:flick .3s ease-in-out infinite alternate}
.c.born{animation:born .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes burn{0%{filter:none}30%{filter:sepia(1) saturate(6) hue-rotate(-25deg) brightness(1.3);transform:scale(1.05)}70%{filter:sepia(1) saturate(6) hue-rotate(-25deg) brightness(.6);transform:scale(.95) rotate(-3deg)}100%{filter:brightness(0);transform:scale(.4) rotate(8deg);opacity:0}}
@keyframes flick{from{transform:translateY(0) scale(.9)}to{transform:translateY(-5px) scale(1.2)}}
@keyframes born{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.modes{display:flex;gap:4px;align-items:center;justify-content:center}
.lb{font-size:12px;font-weight:700;opacity:.8}
.md{font:inherit;font-weight:800;font-size:13px;padding:4px 10px;border-radius:999px;border:2px solid var(--gold);background:transparent;color:#fff;cursor:pointer}
.md.on{background:var(--gold);color:var(--ink)}
#lv .md{padding:4px 6px;font-size:12px}
#mrow{gap:3px}#mrow .md{padding:4px 7px;font-size:12px;white-space:nowrap}
.md,.lb{white-space:nowrap}
#lv,.sbar{gap:3px}
.ic{font-family:inherit;flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--gold);color:var(--ink);font-size:18px;font-weight:800;cursor:pointer}
#gal{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 3vw 20px}
.gh{display:flex;justify-content:space-between;align-items:center;max-width:420px;margin:0 auto 8px;font-size:20px}
.gs{max-width:420px;margin:10px auto 6px;font-size:13px;opacity:.85;font-weight:700}
.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:420px;margin:0 auto}
.gi{aspect-ratio:3/4;border-radius:12px;background:var(--bg2);border:2px dashed rgba(255,255,255,.3);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;font:inherit;text-align:center}
.gi .ge{font-size:38px}
#gal.gpaged{overflow:hidden;display:flex;flex-direction:column;padding-left:0;padding-right:0}
#gal.gpaged .gh{width:94vw;max-width:420px}
.gpg{flex:1;min-height:0;overflow:hidden;touch-action:none}
.gtr{display:flex;height:100%;will-change:transform}
.gp{flex:0 0 100%;overflow:hidden;padding:0 3vw}
.gp .gs{display:flex;justify-content:space-between;align-items:baseline;font-size:16px;margin-top:4px}
.gp .gs span{font-size:12px;opacity:.7}
.gg.gw{display:flex;flex-wrap:wrap;justify-content:center}
.gg.gw .gi{width:calc((100% - 16px)/3)}
.gnav{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 0 2px}
.gdt{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.35);cursor:pointer}
.gdt.on{background:var(--gold);transform:scale(1.25)}
.gar{font:inherit;font-size:14px;width:38px;height:32px;border-radius:999px;border:2px solid var(--gold);background:var(--bg2);color:var(--gold);cursor:pointer}
.gar.off{opacity:.3}
body:has(#gal) .wbgm{visibility:hidden} /* ギャラリーを見てる間は♪ボタンを隠して、×と重ならないようにするよ */
.ghint{text-align:center;font-size:11px;opacity:.6;padding-bottom:6px}
.gi img{width:100%;flex:1;min-height:0;object-fit:cover;object-position:50% 25%;border-radius:8px;background:#fff}
.gi.on.wc{padding:3px;gap:2px}
.gi b{font-size:12px}
.gi small{font-size:10px;opacity:.8;line-height:1.2}
.gi.on{background:linear-gradient(160deg,#fff7d6,#ffd23f);border:3px solid #fff;color:var(--ink);cursor:pointer;box-shadow:0 0 12px rgba(255,210,63,.5)}

<script>
// ---- BGM（ゲームごとの曲。曲のデータはファイルの一番最後にあるよ） ----
(()=>{
// トリック・バトルはターン・オア・ラッシュと同じ曲を使うよ
const TR={tot:'totBgmData',spd:'torBgmData',pm:'pmBgmData',tor:'torBgmData',title:'titleBgmData'};
const WB={on:true,vol:.35,cur:null,el:{},g:{},ft:null};
try{if(localStorage.getItem('wc_tot_bgm')==='0')WB.on=false}catch(e){}
WB.lv=3;try{const n=+localStorage.getItem('wc_bgm_lv');if(n>=1&&n<=5)WB.lv=n}catch(e){}
// 音量の倍率（3がいままでの大きさ）
WB.mul=()=>[0,.2,.5,1,1.4,1.8][WB.lv]||1;
const SCR={tot:'tot',spd:'spd',pm:'shin',tor:'shin',title:'title'};
// いま見えてる画面の曲の名前（ピース・メモリーとターン・オア・ラッシュは同じ画面だから、FASTで見分けるよ）
function nowKey(){const v=id=>{const e=document.getElementById(id);return !!(e&&!e.hidden)};if(v('title'))return 'title';if(v('tot'))return 'tot';if(v('spd'))return 'spd';if(v('shin')){let f=false;try{f=FAST}catch(e){}return f?'tor':'pm'}return null}
function btns(){document.querySelectorAll('.wbgm').forEach(b=>{if(!b.dataset.synth){const sc=b.closest('.scr'),k=sc&&(sc.id==='shin'?nowKey():Object.keys(SCR).find(k=>SCR[k]===sc.id));b.style.display=k&&document.getElementById(TR[k])?'':'none';}b.textContent=WB.on?'♪'+WB.lv:'♪×';b.style.opacity=WB.on?1:.55;b.setAttribute('aria-label',WB.on?'BGMオン':'BGMオフ')})}
function getEl(k){
  if(WB.el[k])return WB.el[k];
  try{const d=document.getElementById(TR[k]);if(!d)return null;const bin=atob(d.textContent.trim()),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    const a=new Audio();a.loop=true;a.preload='auto';a.src=URL.createObjectURL(new Blob([u],{type:'audio/mpeg'}));a.load();WB.el[k]=a;
    try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const src=AC.createMediaElementSource(a),g=AC.createGain();g.gain.value=0;src.connect(g);g.connect(AC.destination);WB.g[k]=g}catch(e){WB.g[k]=null}
    return a}catch(e){return null}
}
function vget(k){const g=WB.g[k];return g?g.gain.value:WB.el[k].volume}
function vset(k,v){const g=WB.g[k];if(g)g.gain.value=v;else try{WB.el[k].volume=v}catch(e){}}
function fade(k,to,ms,after){clearInterval(WB.ft);const from=vget(k),t0=performance.now();WB.ft=setInterval(()=>{const r=Math.min(1,(performance.now()-t0)/ms);vset(k,from+(to-from)*r);if(r>=1){clearInterval(WB.ft);after&&after()}},30)}
WB.play=(k,fromTop=true)=>{
  if(WB.cur&&WB.cur!==k)WB.halt();
  // ほかの曲が裏で鳴りっぱなしにならないよう、ぜんぶ止めてから流すよ
  Object.keys(WB.el).forEach(x=>{if(x!==k&&!WB.el[x].paused){vset(x,0);WB.el[x].pause()}});
  WB.cur=k;if(!WB.on)return;
  const a=getEl(k);if(!a)return;
  try{if(AC&&AC.state==='suspended')AC.resume()}catch(e){}
  if(fromTop)try{a.currentTime=0}catch(e){}
  const p=a.play();if(p&&p.catch)p.catch(()=>{});
  fade(k,WB.vol*WB.mul(),1200);
};
WB.halt=()=>{const k=WB.cur;if(k&&WB.el[k]){clearInterval(WB.ft);vset(k,0);WB.el[k].pause()}};
WB.stop=()=>{const k=WB.cur;WB.cur=null;if(k&&WB.el[k]){const a=WB.el[k];fade(k,0,400,()=>{if(WB.cur!==k)a.pause()})}};
// ---- 音量（5段階）。♪ボタンを押すと音量のまどが開くよ ----
function setOn(on){WB.on=on;try{localStorage.setItem('wc_tot_bgm',on?'1':'0')}catch(e){}btns();
  const k=nowKey();
  if(on){if(k)WB.play(k,false)}else{const c=WB.cur;if(c&&WB.el[c]){const a=WB.el[c];fade(c,0,400,()=>a.pause())}}}
function setLv(n){WB.lv=n;try{localStorage.setItem('wc_bgm_lv',String(n))}catch(e){}
  if(!WB.on){setOn(true)}else{const c=WB.cur;if(c&&WB.el[c]&&!WB.el[c].paused)fade(c,WB.vol*WB.mul(),250)}
  btns();drawPop()}
function closePop(){const p=document.getElementById('wbgmPop');if(p)p.remove()}
function drawPop(){const p=document.getElementById('wbgmPop');if(!p)return;
  p.querySelectorAll('.wvl').forEach(b=>{const n=+b.dataset.lv;b.classList.toggle('on',WB.on&&n<=WB.lv);b.classList.toggle('now',WB.on&&n===WB.lv)});
  p.querySelector('.woff').classList.toggle('now',!WB.on);
  p.querySelector('.wlab').textContent=WB.on?('BGMの音量 '+WB.lv+' / 5'):'BGMはオフだよ'}
function openPop(b){closePop();const p=document.createElement('div');p.id='wbgmPop';
  let h='<div class="wlab"></div><div class="wrow"><button class="woff" type="button">オフ</button>';
  for(let n=1;n<=5;n++)h+='<button class="wvl" type="button" data-lv="'+n+'" aria-label="音量'+n+'"><i style="height:'+(6+n*5)+'px"></i><span>'+n+'</span></button>';
  p.innerHTML=h+'</div>';document.body.appendChild(p);drawPop();
  const r=b.getBoundingClientRect(),w=p.offsetWidth,vw=window.innerWidth;
  p.style.top=Math.round(r.bottom+6)+'px';p.style.left=Math.round(Math.max(8,Math.min(vw-w-8,r.right-w)))+'px';
  p.addEventListener('click',e=>{e.stopPropagation();const v=e.target.closest('.wvl');if(v)return setLv(+v.dataset.lv);if(e.target.closest('.woff')){setOn(false);drawPop()}})}
document.addEventListener('click',e=>{const b=e.target.closest('.wbgm');
  if(!b){if(!e.target.closest('#wbgmPop'))closePop();return}
  if(document.getElementById('wbgmPop'))closePop();else openPop(b)});
(()=>{const st=document.createElement('style');st.textContent=`
#wbgmPop{position:fixed;z-index:9999;background:#2a0f3d;border:2px solid #ff9f1c;border-radius:14px;padding:8px 10px 9px;color:#ffb347;box-shadow:0 6px 18px rgba(0,0,0,.45);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;animation:wpIn .15s ease-out}
@keyframes wpIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

#wbgmPop .woff{font-size:11.5px;padding:0 8px;height:42px;margin-right:3px}
#wbgmPop .woff.now{border-color:#ff9f1c;color:#ffb347;background:#3d1856}
#wbgmPop .wvl{width:32px;height:42px;padding:0 0 3px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px}
#wbgmPop .wvl i{display:block;width:10px;border-radius:3px;background:#6b3a8a}
#wbgmPop .wvl span{font-size:10px;line-height:1}
#wbgmPop .wvl.on i{background:#ff9f1c}
#wbgmPop .wvl.on{color:#ffb347}
#wbgmPop .wvl.now{border-color:#ff9f1c;background:#3d1856}`;document.head.appendChild(st)})();
document.addEventListener('visibilitychange',()=>{const k=WB.cur;if(!k||!WB.on||!WB.el[k])return;if(document.hidden)WB.el[k].pause();else WB.play(k,false)});
// タイトル画面が見えてる間はタイトルの曲を流すよ（戻ってきた時もここで流れはじめるよ）
setInterval(()=>{if(nowKey()==='title'&&WB.cur!=='title'&&document.getElementById(TR.title)&&!document.hidden)WB.play('title')},200);
// iPhoneは最初に画面に触るまで音を出せないから、最初のタッチで鳴らすよ
// iPhoneは「指を離した時（タップ完了）」でないと音を鳴らす許可をくれないから、そこで鳴らし直すよ
function unlock(){try{if(AC&&AC.state!=='running')AC.resume()}catch(e){}
  const k=nowKey()||WB.cur;if(!k||!WB.on)return;if(!document.getElementById(TR[k]))return;
  const a=getEl(k);if(a&&(a.paused||WB.cur!==k))WB.play(k,WB.cur!==k)}
['touchend','click','pointerup','keydown'].forEach(ev=>document.addEventListener(ev,unlock,true));
btns();WB.btns=btns;window.WB=WB;
// ---- スクロール止め：画面はぜんぶ1画面に収まるから、ページごと動かないようにするよ ----
// （ルールやギャラリーみたいに、中身が長いまどの中だけはスクロールできるよ）
(()=>{const st=document.createElement('style');st.textContent='html,body{overflow:hidden!important;overscroll-behavior:none;height:100%}#gal,#tov .bx,#tst .bx{overscroll-behavior:contain}';document.head.appendChild(st);
function canScroll(el){for(;el&&el!==document.body&&el!==document.documentElement;el=el.parentElement){const cs=getComputedStyle(el),oy=cs.overflowY;if((oy==='auto'||oy==='scroll')&&el.scrollHeight>el.clientHeight+1)return el}return null}
let sy=0,box=null;
document.addEventListener('touchstart',e=>{sy=e.touches[0].clientY;box=canScroll(e.target)},{passive:true,capture:true});
document.addEventListener('touchmove',e=>{
  if(e.touches.length>1)return; // 2本指（拡大）はそのまま
  if(!box){e.preventDefault();return}
  // まどの端まで行ったら、それ以上引っぱってもページは動かさないよ
  const dy=e.touches[0].clientY-sy,top=box.scrollTop<=0,bot=box.scrollTop+box.clientHeight>=box.scrollHeight-1;
  if((dy>0&&top)||(dy<0&&bot))e.preventDefault();
},{passive:false,capture:true});
window.addEventListener('scroll',()=>{if(scrollY)scrollTo(0,0)});
})();

})();

<script>

(()=>{
const M=n=>440*Math.pow(2,(n-69)/12),_=null;
const E={song:null,step:0,next:0,timer:null,bus:null,lp:null,nb:null};
function setup(){
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(E.bus)return;
  E.bus=AC.createGain();E.bus.gain.value=0;E.bus.connect(AC.destination);
  E.lp=AC.createBiquadFilter();E.lp.type='lowpass';E.lp.frequency.value=1100;E.lp.Q.value=4;E.lp.connect(E.bus);
  const n=Math.floor(AC.sampleRate*.12);E.nb=AC.createBuffer(1,n,AC.sampleRate);const c=E.nb.getChannelData(0);for(let i=0;i<n;i++)c[i]=Math.random()*2-1;

 bright:{bpm:92,R:[48,45,41,43],C:[[60,64,67],[57,60,64],[53,57,60],[55,59,62]],w:'triangle',o:12},
 normal:{bpm:84,R:[45,41,48,43],C:[[57,60,64],[53,57,60],[60,64,67],[55,59,62]],w:'triangle',o:12},

 play(s,t,d){const P=PMS[pmv()],b=Math.floor(s/8),i=s%8,ch=P.C[b%4],r=P.R[b%4],c=G(()=>chain,0);
